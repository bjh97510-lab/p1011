  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const $ = id => document.getElementById(id);
    Forest.mountPouch($('pouch'));

    /* =========================================================
       3D 뷰어 (하나의 렌더러를 모든 단원이 함께 씀)
       ========================================================= */
    const host = $('viewer');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, stencil: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.localClippingEnabled = true;
    host.appendChild(renderer.domElement);
    $('viewer-loading').remove();

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 300);
    camera.position.set(6, 5, 8);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08;
    controls.minDistance = 1.5; controls.maxDistance = 60; controls.autoRotateSpeed = 1.6;
    scene.add(new THREE.HemisphereLight(0xfff6e0, 0x7a8f5c, 1.15));
    const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.position.set(5, 10, 7); scene.add(sun);
    const back = new THREE.DirectionalLight(0xffffff, 0.55); back.position.set(-6, 4, -5); scene.add(back);
    const ground = new THREE.Mesh(new THREE.CircleGeometry(14, 72), new THREE.MeshBasicMaterial({ color: 0xd9e5c2, transparent: true, opacity: 0.6, depthWrite: false }));
    ground.rotation.x = -Math.PI / 2; ground.position.y = -0.002; scene.add(ground);
    const content = new THREE.Group(); scene.add(content);

    function resize() {
      const w = host.clientWidth, h = host.clientHeight; if (!w || !h) return;
      renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
    }
    new ResizeObserver(resize).observe(host);

    let tickFn = null, lastT = performance.now();
    renderer.setAnimationLoop(() => {
      const now = performance.now(), dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
      if (tickFn) tickFn(dt);
      controls.update();
      renderer.render(scene, camera);
    });

    function disposeTree(o) {
      o.traverse(n => {
        if (n.geometry) n.geometry.dispose();
        if (n.material) [].concat(n.material).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
      });
    }
    function clearContent() { [...content.children].forEach(c => { content.remove(c); disposeTree(c); }); }

    let frameArgs = null;
    function frame(box, dir = new THREE.Vector3(1, 0.8, 1.3), pad = 1.2) {
      frameArgs = [box.clone(), dir.clone(), pad];
      const sphere = box.getBoundingSphere(new THREE.Sphere());
      const fov = THREE.MathUtils.degToRad(camera.fov), aspectFit = Math.min(1, camera.aspect);
      const dist = sphere.radius * pad / Math.sin(fov / 2) / Math.max(0.6, aspectFit);
      controls.target.copy(sphere.center);
      camera.position.copy(sphere.center).add(dir.clone().normalize().multiplyScalar(dist));
      camera.near = dist / 100; camera.far = dist * 20; camera.updateProjectionMatrix();
    }
    const boxOf = obj => new THREE.Box3().setFromObject(obj);
    $('vt-reset').addEventListener('click', () => frameArgs && frame(...frameArgs));
    $('vt-rotate').addEventListener('click', e => { controls.autoRotate = !controls.autoRotate; e.currentTarget.setAttribute('aria-pressed', String(controls.autoRotate)); });
    function setAutoRotate(on) { controls.autoRotate = on; $('vt-rotate').setAttribute('aria-pressed', String(on)); }
    function setBadge(html) { const b = $('badge'); b.hidden = !html; b.innerHTML = html || ''; }

    /* ---------- 재료 & 도우미 ---------- */
    const COL = { base: 0xe8b64a, side: 0x7fb069, hi: 0xe07a5f, wood: 0xd9a066, sky: 0x8fbcd4, stone: 0x9c8a6c, ink: 0x3b2a18 };
    const FACE_PALETTE = [0xe8b64a, 0x7fb069, 0x8fbcd4, 0xe07a5f, 0xc9a0dc, 0xf2c6a0, 0x9fd4c0, 0xf4a6b8];
    const mat = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.62, metalness: 0.02 }, o));
    const lineMat = (o = {}) => new THREE.LineBasicMaterial(Object.assign({ color: COL.ink, transparent: true, opacity: 0.85 }, o));
    function withEdges(mesh, angle = 25, clip) {
      const e = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry, angle), lineMat(clip ? { clippingPlanes: clip } : {}));
      e.userData.edge = true; mesh.add(e); return mesh;
    }
    function lathe(profile, segs = 72, phiStart = 0, phiLength = Math.PI * 2) {
      const g = new THREE.LatheGeometry(profile.map(p => new THREE.Vector2(p[0], p[1])), segs, phiStart, phiLength);
      g.computeVertexNormals(); return g;
    }
    function arcPts(cx, cy, R, a0, a1, n = 24) { // 도(degree) 단위
      return Array.from({ length: n + 1 }, (_, i) => { const a = THREE.MathUtils.degToRad(a0 + (a1 - a0) * i / n); return [cx + R * Math.cos(a), cy + R * Math.sin(a)]; });
    }
    function label(text, { color = '#2f251a', bg = 'rgba(255,250,235,.92)', size = 0.32 } = {}) {
      const c = document.createElement('canvas'), ctx = c.getContext('2d');
      const font = '46px Jua, "Malgun Gothic", sans-serif';
      ctx.font = font; const w = Math.ceil(ctx.measureText(text).width) + 34, h = 68;
      c.width = w; c.height = h; ctx.font = font;
      ctx.fillStyle = bg; ctx.strokeStyle = 'rgba(87,55,25,.55)'; ctx.lineWidth = 3;
      ctx.beginPath(); const r = 18; ctx.moveTo(r, 2); ctx.lineTo(w - r, 2); ctx.quadraticCurveTo(w - 2, 2, w - 2, r); ctx.lineTo(w - 2, h - r); ctx.quadraticCurveTo(w - 2, h - 2, w - r, h - 2); ctx.lineTo(r, h - 2); ctx.quadraticCurveTo(2, h - 2, 2, h - r); ctx.lineTo(2, r); ctx.quadraticCurveTo(2, 2, r, 2); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, w / 2, h / 2 + 2);
      const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
      sp.scale.set(size * w / h, size, 1); sp.renderOrder = 30; return sp;
    }
    const fmt = n => (Math.round(n * 100) / 100).toLocaleString('ko-KR', { maximumFractionDigits: 2 });
    function piStr(a, b) { // a + bπ
      const parts = [];
      if (a) parts.push(fmt(a));
      if (b) parts.push((b === 1 ? '' : fmt(b)) + 'π');
      return parts.join(' + ') || '0';
    }

    /* =========================================================
       1단원: 입체도형 관찰
       ========================================================= */
    const SOLIDS = {
      poly: [
        { id: 'cube', name: '정육면체', v: 8, e: 12, f: 6, sec: { h: '정사각형', v: '정사각형' }, about: '6개의 면이 모두 합동인 정사각형이야. 정다면체 중 하나!',
          build: () => [new THREE.BoxGeometry(2.2, 2.2, 2.2).translate(0, 1.1, 0)] },
        { id: 'cuboid', name: '직육면체', v: 8, e: 12, f: 6, sec: { h: '직사각형', v: '직사각형' }, about: '6개의 면이 모두 직사각형이고, 마주 보는 면끼리 합동이야.',
          build: () => [new THREE.BoxGeometry(3.2, 1.8, 2).translate(0, 0.9, 0)] },
        { id: 'tri-prism', name: '삼각기둥', v: 6, e: 9, f: 5, sec: { h: '삼각형', v: '직사각형' }, about: '두 밑면이 평행하고 합동인 삼각형, 옆면은 직사각형이야.',
          build: () => [new THREE.CylinderGeometry(1.5, 1.5, 2.6, 3, 1).translate(0, 1.3, 0)] },
        { id: 'pent-prism', name: '오각기둥', v: 10, e: 15, f: 7, sec: { h: '오각형', v: '직사각형' }, about: 'n각기둥은 면 (n+2)개, 모서리 3n개, 꼭짓점 2n개야.',
          build: () => [new THREE.CylinderGeometry(1.4, 1.4, 2.4, 5, 1).translate(0, 1.2, 0)] },

      ],
      rot: [
        { id: 'cylinder', name: '원기둥', gen: '직사각형', sec: { h: '원', v: '직사각형', vOff: '직사각형 (폭이 좁아져)' }, about: '직사각형의 한 변을 축으로 한 바퀴 돌리면 원기둥이 돼.',

          profile: arcPts(0, 1.5, 1.5, -90, 90, 40) },
        { id: 'frustum', name: '원뿔대', gen: '사다리꼴', sec: { h: '원', v: '사다리꼴', vOff: '곡선이 있는 도형' }, about: '두 각이 직각인 사다리꼴을 돌리면 원뿔대가 돼.',

      ],
      combo: [
        { id: 'rocket', name: '원기둥 + 원뿔', sec: { h: '원', v: '오각형 (직사각형 + 삼각형)' }, about: '원기둥 위에 원뿔을 얹은 로켓 모양이야. 겉넓이·부피는 두 도형으로 나눠서 구해.',

          build: () => [new THREE.BoxGeometry(2.2, 1.6, 2.2).translate(0, 0.8, 0), new THREE.ConeGeometry(2.2 / Math.SQRT2, 1.3, 4, 1).rotateY(Math.PI / 4).translate(0, 1.6 + 0.65, 0)] }
      ]
    };

    function unitObserve(panel) {
      let group = 'poly', solid = SOLIDS.poly[0];
      let section = false, dir = 'h', pos = 50;
      let sweepMode = false, sweep = 360, playing = false;
      const plane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e3), negPlane = new THREE.Plane();
      let solids = [], caps = null, stencils = [], ghosts = [], bounds = new THREE.Box3();
      let sweepObj = null;

      panel.innerHTML = `
        <div><div class="group-label">도형 종류</div>
          <div class="chip-row" id="o-groups">
            <button class="chip" data-g="poly" aria-pressed="true">다면체</button>
            <button class="chip" data-g="rot" aria-pressed="false">회전체</button>
            <button class="chip" data-g="combo" aria-pressed="false">복합 입체도형</button>
          </div></div>
        <div><div class="group-label">도형 고르기</div><div class="chip-row" id="o-solids"></div></div>
        <div class="info" id="o-info"></div>
        <div>
          <div class="chip-row"><button class="chip" id="o-section" aria-pressed="false">단면 자르기</button>
            <button class="chip" id="o-edges" aria-pressed="true">모서리 선</button></div>
          <div id="o-sec-ctrl" hidden style="margin-top:.6rem">
            <div class="chip-row" id="o-dir">
              <button class="chip" data-d="h" aria-pressed="true">수평으로 자르기</button>
              <button class="chip" data-d="v" aria-pressed="false">수직으로 자르기</button>
            </div>
            <div class="slider-row" style="margin-top:.4rem"><label for="o-pos"><span>자르는 위치</span><output id="o-pos-out" class="tabnum">50%</output></label>
              <input id="o-pos" class="leaf" type="range" min="2" max="98" value="50"></div>
          </div>
        </div>
        <div id="o-sweep-box" hidden>
          <div class="chip-row"><button class="chip" id="o-sweep" aria-pressed="false">회전시켜 만들기</button></div>
          <div id="o-sweep-ctrl" hidden style="margin-top:.4rem">
            <div class="slider-row"><label for="o-sweep-r"><span>돌린 각도</span><output id="o-sweep-out" class="tabnum">360°</output></label>
              <input id="o-sweep-r" class="leaf" type="range" min="0" max="360" step="5" value="360"></div>
            <button class="plank small" id="o-play">▶ 한 바퀴 돌리기</button>
          </div>
        </div>`;

      const solidChips = () => {
        $('o-solids').innerHTML = SOLIDS[group].map(s => `<button class="chip" data-s="${s.id}" aria-pressed="${s === solid}">${s.name}</button>`).join('');
      };
      function info() {
        const s = solid;
        let html = `<h4>${s.name}</h4><p style="margin:0">${s.about}</p>`;
        if (group === 'poly') html += `<div class="counts"><div><b>${s.f}</b><span>면</span></div><div><b>${s.e}</b><span>모서리</span></div><div><b>${s.v}</b><span>꼭짓점</span></div></div>
          <p class="muted" style="margin:.4rem 0 0;font-size:.88rem">꼭짓점 − 모서리 + 면 = ${s.v} − ${s.e} + ${s.f} = <b style="font-weight:400;color:#c2553f">${s.v - s.e + s.f}</b> (오일러의 공식)</p>`;
        if (group === 'rot') html += `<p class="muted" style="margin:.4rem 0 0;font-size:.9rem">돌린 평면도형: <b style="font-weight:400;color:var(--bark-deep)">${s.gen}</b> · 회전축을 품은 평면으로 자르면 <b style="font-weight:400;color:var(--bark-deep)">${s.sec.v}</b> (선대칭도형)</p>`;
        $('o-info').innerHTML = html;
      }

      function geometriesOf(s) { return s.profile ? [lathe(s.profile)] : s.build(); }
      function build() {
        clearContent(); solids = []; stencils = []; ghosts = []; caps = null; sweepObj = null;
        const isPoly = group === 'poly' || solid.id === 'house';
        const root = new THREE.Group(); content.add(root);
        geometriesOf(solid).forEach((geo, i) => {
          const m = new THREE.Mesh(geo, mat(i ? COL.hi : (group === 'rot' ? COL.sky : group === 'combo' ? 0xf2c6a0 : COL.base), { flatShading: isPoly, clippingPlanes: [plane] }));
          withEdges(m, isPoly ? 20 : 40, [plane]);
          root.add(m); solids.push(m);
          // 잘린 쪽 반투명 그림자
          const g = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x8a7a5c, transparent: true, opacity: 0.13, depthWrite: false, clippingPlanes: [negPlane] }));
          g.visible = false; root.add(g); ghosts.push(g);
          // 단면을 칠하기 위한 스텐실
          const sg = new THREE.Group();
          const base = { depthWrite: false, depthTest: false, colorWrite: false, stencilWrite: true, stencilFunc: THREE.AlwaysStencilFunc, clippingPlanes: [plane] };
          const m0 = new THREE.MeshBasicMaterial(Object.assign({}, base, { side: THREE.BackSide, stencilFail: THREE.IncrementWrapStencilOp, stencilZFail: THREE.IncrementWrapStencilOp, stencilZPass: THREE.IncrementWrapStencilOp }));
          const m1 = new THREE.MeshBasicMaterial(Object.assign({}, base, { side: THREE.FrontSide, stencilFail: THREE.DecrementWrapStencilOp, stencilZFail: THREE.DecrementWrapStencilOp, stencilZPass: THREE.DecrementWrapStencilOp }));
          const s0 = new THREE.Mesh(geo, m0), s1 = new THREE.Mesh(geo, m1); s0.renderOrder = 1; s1.renderOrder = 1;
          sg.add(s0, s1); sg.visible = false; root.add(sg); stencils.push(sg);
        });
        caps = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), new THREE.MeshStandardMaterial({
          color: COL.hi, roughness: 0.7, side: THREE.DoubleSide,
          stencilWrite: true, stencilRef: 0, stencilFunc: THREE.NotEqualStencilFunc,
          stencilFail: THREE.ReplaceStencilOp, stencilZFail: THREE.ReplaceStencilOp, stencilZPass: THREE.ReplaceStencilOp
        }));
        caps.renderOrder = 1.1; caps.visible = false;
        caps.onAfterRender = r => r.clearStencil();
        content.add(caps);
        bounds = boxOf(root);
        applySection(); info();
        frame(bounds);
      }

      function applySection() {
        const on = section && !sweepMode;
        if (on) {
          const t = pos / 100;
          if (dir === 'h') { plane.normal.set(0, -1, 0); plane.constant = THREE.MathUtils.lerp(bounds.min.y, bounds.max.y, t); }
          else { plane.normal.set(-1, 0, 0); plane.constant = THREE.MathUtils.lerp(bounds.min.x, bounds.max.x, t); }
        } else { plane.normal.set(0, -1, 0); plane.constant = 1e3; }
        negPlane.copy(plane).negate();
        stencils.forEach(s => s.visible = on); ghosts.forEach(g => g.visible = on);
        if (caps) {
          caps.visible = on;
          const p = plane.coplanarPoint(new THREE.Vector3()); caps.position.copy(p); caps.lookAt(p.clone().sub(plane.normal));
        }
        if (on) {
          const centered = Math.abs(pos - 50) < 4;
          const name = dir === 'h' ? solid.sec.h : (centered ? solid.sec.v : (solid.sec.vOff || solid.sec.v));
          setBadge(`단면 모양: <b>${name}</b>`);
        } else setBadge(sweepMode ? `<b>${solid.gen}</b>을(를) 회전축으로 ${sweep}° 돌렸어` : '');
      }

      function buildSweep() {
        if (sweepObj) { content.remove(sweepObj); disposeTree(sweepObj); }
        sweepObj = new THREE.Group();
        const prof = solid.profile;
        const shape = new THREE.Shape(prof.map(p => new THREE.Vector2(p[0], p[1])));
        const flat = new THREE.Mesh(new THREE.ShapeGeometry(shape), mat(COL.hi, { side: THREE.DoubleSide }));
        flat.rotation.y = THREE.MathUtils.degToRad(sweep); flat.position.z = 0.001;
        const H = Math.max(...prof.map(p => p[1]));
        const axisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -0.6, 0), new THREE.Vector3(0, H + 0.8, 0)]);
        const axis = new THREE.Line(axisGeo, new THREE.LineDashedMaterial({ color: 0xc2553f, dashSize: 0.15, gapSize: 0.1 }));
        axis.computeLineDistances();
        const axisLab = label('회전축', { color: '#c2553f', size: 0.3 }); axisLab.position.set(0, H + 1.05, 0);
        sweepObj.add(flat, axis, axisLab);
        if (sweep > 0) {
          const g = lathe(prof, Math.max(3, Math.round(72 * sweep / 360)), Math.PI / 2, THREE.MathUtils.degToRad(sweep));
          sweepObj.add(new THREE.Mesh(g, mat(COL.sky, { side: THREE.DoubleSide, transparent: true, opacity: 0.8 })));
        }
        content.add(sweepObj);
        applySection();
      }
      function setSweepMode(on) {
        sweepMode = on; $('o-sweep').setAttribute('aria-pressed', String(on)); $('o-sweep-ctrl').hidden = !on;
        solids.forEach(m => m.visible = !on);
        if (on) { buildSweep(); setAutoRotate(false); }
        else if (sweepObj) { content.remove(sweepObj); disposeTree(sweepObj); sweepObj = null; applySection(); }
        $('o-section').disabled = on;
      }

      function selectGroup(g) {
        group = g; solid = SOLIDS[g][0];
        $('o-groups').querySelectorAll('[data-g]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.g === g)));
        $('o-sweep-box').hidden = g !== 'rot';
        playing = false; sweepMode = false; $('o-sweep').setAttribute('aria-pressed', 'false'); $('o-sweep-ctrl').hidden = true; $('o-section').disabled = false;
        solidChips(); build();
      }
      $('o-groups').addEventListener('click', e => { const b = e.target.closest('[data-g]'); if (b) selectGroup(b.dataset.g); });
      $('o-solids').addEventListener('click', e => {
        const b = e.target.closest('[data-s]'); if (!b) return;
        solid = SOLIDS[group].find(s => s.id === b.dataset.s);
        playing = false; const wasSweep = sweepMode; sweepMode = false;
        solidChips(); build(); if (wasSweep) setSweepMode(true);
      });
      $('o-section').addEventListener('click', e => {
        section = !section; e.currentTarget.setAttribute('aria-pressed', String(section)); $('o-sec-ctrl').hidden = !section;
        if (section) setAutoRotate(false);
        applySection();
      });
      $('o-edges').addEventListener('click', e => {
        const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', String(on));
        content.traverse(n => { if (n.userData.edge) n.visible = on; });
      });
      $('o-dir').addEventListener('click', e => {
        const b = e.target.closest('[data-d]'); if (!b) return; dir = b.dataset.d;
        $('o-dir').querySelectorAll('[data-d]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        applySection();
      });
      $('o-pos').addEventListener('input', e => { pos = +e.target.value; $('o-pos-out').textContent = pos + '%'; applySection(); });
      $('o-sweep').addEventListener('click', () => setSweepMode(!sweepMode));
      $('o-sweep-r').addEventListener('input', e => { sweep = +e.target.value; $('o-sweep-out').textContent = sweep + '°'; playing = false; buildSweep(); });
      $('o-play').addEventListener('click', () => { sweep = 0; playing = true; });

      let acc = 0;
      tickFn = dt => {
        if (!playing || !sweepMode) return;
        acc += dt; if (acc < 1 / 30) return; acc = 0;
        sweep = Math.min(360, sweep + 6); $('o-sweep-r').value = sweep; $('o-sweep-out').textContent = sweep + '°';
        buildSweep(); if (sweep >= 360) playing = false;
      };
      selectGroup('poly'); setAutoRotate(true);
    }

    /* =========================================================
       전개도 만들기 (2단원·3단원 공용)
       u = 0 접힌 입체, u = 1 펼친 전개도
       ========================================================= */
    function faceMat(color) {
      return mat(color, { side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1, transparent: true, opacity: 1, roughness: 0.7 });
    }
    function makeNet(kind, d, k, colorOf) {
      const faces = [], hinges = [];
      const root = new THREE.Group();
      let idx = 0;
      const addFace = (parent, pts, role) => {
        const shape = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0] * k, p[1] * k)));
        const m = new THREE.Mesh(new THREE.ShapeGeometry(shape), faceMat(colorOf(role, idx++)));
        m.userData.role = role;
        const outline = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts.map(p => new THREE.Vector3(p[0] * k, p[1] * k, 0))), lineMat());
        m.add(outline); parent.add(m); faces.push(m);
      };
      const flap = (parent, A, B, pts, max, role) => {
        const pivot = new THREE.Group(); pivot.position.set(A[0] * k, A[1] * k, 0);
        pivot.rotation.z = Math.atan2(B[1] - A[1], B[0] - A[0]);
        const hinge = new THREE.Group(); pivot.add(hinge); parent.add(pivot);
        addFace(hinge, pts, role); hinges.push({ hinge, max }); return hinge;
      };
      const len = (P, Q) => Math.hypot(Q[0] - P[0], Q[1] - P[1]);
      const ring = (V, mk) => V.forEach((P, i) => { const Q = V[(i + 1) % V.length]; mk(i, flap(root, Q, P, ...mk.spec(len(P, Q), i))); });
      let set;

      if (kind === 'box' || kind === 'triprism' || kind === 'pyramid') {
        root.rotation.x = -Math.PI / 2;
        let V;
        if (kind === 'box') V = [[-d.a / 2, -d.b / 2], [d.a / 2, -d.b / 2], [d.a / 2, d.b / 2], [-d.a / 2, d.b / 2]];
        else if (kind === 'triprism') V = [-90, 30, 150].map(a => [d.s / Math.sqrt(3) * Math.cos(a * Math.PI / 180), d.s / Math.sqrt(3) * Math.sin(a * Math.PI / 180)]);
        else V = [[-d.a / 2, -d.a / 2], [d.a / 2, -d.a / 2], [d.a / 2, d.a / 2], [-d.a / 2, d.a / 2]];
        addFace(root, V, 'base');
        const hingeOf = [];
        V.forEach((P, i) => {
          const Q = V[(i + 1) % V.length], L = len(P, Q);
          if (kind === 'pyramid') hingeOf[i] = flap(root, Q, P, [[0, 0], [L, 0], [L / 2, d.s]], Math.PI - Math.acos((d.a / 2) / d.s), 'side');
          else hingeOf[i] = flap(root, Q, P, [[0, 0], [L, 0], [L, d.c], [0, d.c]], Math.PI / 2, 'side');
        });
        if (kind === 'box') flap(hingeOf[2], [0, d.c], [d.a, d.c], [[0, 0], [d.a, 0], [d.a, d.b], [0, d.b]], Math.PI / 2, 'base');
        if (kind === 'triprism') flap(hingeOf[1], [0, d.c], [d.s, d.c], [[0, 0], [d.s, 0], [d.s / 2, d.s * Math.sqrt(3) / 2]], Math.PI / 2, 'base');
        set = u => hinges.forEach(h => { h.hinge.rotation.x = (1 - u) * h.max; });
      }

      if (kind === 'cylinder') {
        const r = d.r * k, h = d.h * k, W = 2 * Math.PI * r;
        const geo = new THREE.PlaneGeometry(W, h, 120, 1);
        const P0 = geo.attributes.position.array.slice();
        const side = new THREE.Mesh(geo, faceMat(colorOf('side', 0))); side.userData.role = 'side';
        const disc = () => { const g = new THREE.CircleGeometry(r, 72); g.rotateX(-Math.PI / 2); g.translate(0, 0, -r); return g; };
        const ringLine = () => new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(arcPts(0, -r, r, 0, 360, 72).map(p => new THREE.Vector3(p[0], 0, p[1]))), lineMat());
        const capB = new THREE.Group(), capT = new THREE.Group();
        [capB, capT].forEach((c, i) => { const m = new THREE.Mesh(disc(), faceMat(colorOf('base', i + 1))); m.userData.role = 'base'; m.add(ringLine()); c.add(m); faces.push(m); });
        faces.push(side); root.add(side, capB, capT);
        set = u => {
          const kap = (1 - u) / r, pos = geo.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const s = P0[3 * i], y = P0[3 * i + 1] + h / 2;
            if (kap < 1e-4) pos.setXYZ(i, s, y, r);
            else pos.setXYZ(i, Math.sin(kap * s) / kap, y, (r - 1 / kap) + Math.cos(kap * s) / kap);
          }
          pos.needsUpdate = true; geo.computeVertexNormals(); geo.computeBoundingSphere(); geo.computeBoundingBox();
          capB.position.set(0, 0, r); capB.rotation.x = -u * Math.PI / 2;
          capT.position.set(0, h, r); capT.rotation.x = u * Math.PI / 2;
          root.position.y = 2 * r * Math.sin(u * Math.PI / 2);
        };
      }

      if (kind === 'cone') {
        const r = d.r * k, L = d.l * k, Phi = 2 * Math.PI * r / L, h0 = Math.sqrt(L * L - r * r);
        const NA = 96, NR = 12, geo = new THREE.BufferGeometry();
        const params = [], index = [];
        for (let j = 0; j <= NR; j++) for (let i = 0; i <= NA; i++) params.push([L * j / NR, -Phi / 2 + Phi * i / NA]);
        for (let j = 0; j < NR; j++) for (let i = 0; i < NA; i++) {
          const a = j * (NA + 1) + i, b = a + 1, c = a + NA + 1, e = c + 1;
          index.push(a, c, b, b, c, e);
        }
        geo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(params.length * 3), 3)); geo.setIndex(index);
        const side = new THREE.Mesh(geo, faceMat(colorOf('side', 0))); side.userData.role = 'side';
        const cap = new THREE.Group();
        const dg = new THREE.CircleGeometry(r, 72); dg.rotateX(-Math.PI / 2); dg.translate(0, 0, -r);
        const capM = new THREE.Mesh(dg, faceMat(colorOf('base', 1))); capM.userData.role = 'base';
        capM.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(arcPts(0, -r, r, 0, 360, 72).map(p => new THREE.Vector3(p[0], 0, p[1]))), lineMat()));
        cap.add(capM); faces.push(side, capM); root.add(side, cap);
        const g0 = Math.atan2(h0, r);
        set = u => {
          const Psi = Phi + u * (2 * Math.PI - Phi), rc = L * Psi / (2 * Math.PI), hc = Math.sqrt(Math.max(0, L * L - rc * rc));
          const pos = geo.attributes.position;
          params.forEach(([rho, al], i) => {
            const be = al * 2 * Math.PI / Psi, rr = rho * rc / L;
            pos.setXYZ(i, rr * Math.sin(be), hc * (1 - rho / L), rr * Math.cos(be));
          });
          pos.needsUpdate = true; geo.computeVertexNormals(); geo.computeBoundingSphere(); geo.computeBoundingBox();
          const ga = Math.atan2(hc, rc), de = g0 + u * (Math.PI - g0), a = ga - de;
          cap.position.set(0, 0, rc); cap.rotation.x = a;
          root.position.y = Math.max(0, -2 * r * Math.sin(a));
        };
      }
      return { root, faces, set };
    }

    const NET_SOLIDS = [

    function unitNet(panel) {

    const AREA_SOLIDS = [

    function unitVolume(panel) {

      /* --- L자형 --- */
      function modeL() {
        const d = { W: 8, H: 6, D: 4, t: 2, w: 3 }; let view = 'whole';
        body.innerHTML = `
          <div class="chip-row" id="l-view">
            <button class="chip" data-v="whole" aria-pressed="true">통째로 보기</button>
            <button class="chip" data-v="split" aria-pressed="false">두 덩어리로 나누기</button>

          <div class="info" id="l-calc"></div>`;
        function build(keep) {
          clearContent();
          const k = 3.6 / Math.max(d.W, d.H), g = new THREE.Group(); content.add(g);

          L(`${d.w} cm`, d.w / 2, d.H + 0.4, d.D);
          L(`${d.t} cm`, d.W + 0.6, d.t / 2, -0.3);
          const v1 = d.W * d.t * d.D, v2 = d.w * (d.H - d.t) * d.D, big = d.W * d.H * d.D, miss = (d.W - d.w) * (d.H - d.t) * d.D;
          $('l-calc').innerHTML = `<h4>부피 = ${v1 + v2} cm³</h4>
            <p style="margin:.2rem 0"><b style="font-weight:400;color:var(--moss-deep)">방법 1 · 나누어 더하기</b><br>아래층 ${d.W}×${d.D}×${d.t} = ${v1} &nbsp;+&nbsp; 위층 ${d.w}×${d.D}×${d.H - d.t} = ${v2}<br>= <b style="font-weight:400">${v1 + v2} cm³</b></p>
            <p style="margin:.2rem 0"><b style="font-weight:400;color:#c2553f">방법 2 · 큰 상자에서 빼기</b><br>큰 상자 ${d.W}×${d.D}×${d.H} = ${big} &nbsp;−&nbsp; 빈 곳 ${d.W - d.w}×${d.D}×${d.H - d.t} = ${miss}<br>= <b style="font-weight:400">${big - miss} cm³</b></p>`;
          setBadge(`L자형 입체 · 부피 <b>${v1 + v2} cm³</b>`);

        }
        body.querySelectorAll('input[type=range]').forEach(inp => inp.addEventListener('input', () => {
          const key = inp.id.slice(2); d[key] = +inp.value;
          if (d.t >= d.H) d.t = d.H - 1; if (d.w >= d.W) d.w = d.W - 1;
          ['W', 'H', 'D', 't', 'w'].forEach(q => { $('l-' + q).value = d[q]; $('l-' + q + '-out').textContent = d[q] + ' cm'; });
          build(true);
        }));
        $('l-view').addEventListener('click', e => {
          const b = e.target.closest('[data-v]'); if (!b) return; view = b.dataset.v;
          $('l-view').querySelectorAll('[data-v]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); build(true);
        });
        build();
      }

      /* --- 구멍 뚫린 기둥 --- */
      function modeHollow() {
        const d = { R: 4, r: 2, h: 6 }; let showCore = true;
        body.innerHTML = `
          <div class="chip-row"><button class="chip" id="h-core" aria-pressed="true">빠진 원기둥 보기</button></div>
          <div class="grid gap-1">${slider('h-R', '바깥 반지름 R', 2, 6, d.R)}${slider('h-r', '구멍 반지름 r', 1, 5, d.r)}${slider('h-h', '높이 h', 2, 9, d.h)}</div>
          <div class="info" id="h-calc"></div>`;
        function build(keep) {
          clearContent();
          const k = 3 / Math.max(d.R * 2, d.h), R = d.R * k, r = d.r * k, h = d.h * k;
          const prof = [[r, 0], [R, 0], [R, 0], [R, h], [R, h], [r, h], [r, h], [r, 0]];
          const m = new THREE.Mesh(lathe(prof, 96), mat(COL.wood)); withEdges(m, 40); content.add(m);
          if (showCore) {
            const core = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.995, r * 0.995, h, 64).translate(0, h / 2 + h * 0.62, 0), mat(COL.hi, { transparent: true, opacity: 0.55, depthWrite: false }));
            withEdges(core, 40); content.add(core);

          }

          const lh = label(`h = ${d.h} cm`, { size: 0.24 }); lh.position.set(R + 0.5, h / 2, 0); content.add(lh);
          const big = d.R * d.R * d.h, small = d.r * d.r * d.h;
          $('h-calc').innerHTML = `<h4>부피 = ${piStr(0, big - small)} cm³ <span class="muted tabnum" style="font-size:.85rem">(≈ ${fmt((big - small) * Math.PI)})</span></h4>
            <p style="margin:.2rem 0">(큰 원기둥) − (빠진 원기둥)<br>= π × ${d.R}² × ${d.h} − π × ${d.r}² × ${d.h}<br>= ${big}π − ${small}π = <b style="font-weight:400">${big - small}π cm³</b></p>
            <p class="muted" style="margin:0;font-size:.88rem">π × (R² − r²) × h 로 한 번에 계산해도 돼.</p>`;
          setBadge(`구멍 뚫린 원기둥 · 부피 <b>${big - small}π cm³</b>`);
          if (!keep) frame(boxOf(content), new THREE.Vector3(0.9, 1.1, 1.3));
        }
        body.querySelectorAll('input[type=range]').forEach(inp => inp.addEventListener('input', () => {
          d[inp.id.slice(2)] = +inp.value; if (d.r >= d.R) d.r = d.R - 1;
          ['R', 'r', 'h'].forEach(q => { $('h-' + q).value = d[q]; $('h-' + q + '-out').textContent = d[q] + ' cm'; });
          build(true);
        }));
        $('h-core').addEventListener('click', e => { showCore = !showCore; e.currentTarget.setAttribute('aria-pressed', String(showCore)); build(true); });

      /* --- 수조 실험 --- */
      function modeTank() {
        const T = { W: 24, D: 10, H: 20, water: 12 }, BASE = T.W * T.D, k = 0.17;
        const STONES = [
          { id: 'A', name: '정육면체 돌', size: [6, 6, 6], x: -8, color: 0x9c8a6c },
          { id: 'B', name: '직육면체 돌', size: [8, 6, 5], x: 0, color: 0x8b7d6b },
          { id: 'C', name: '작은 직육면체 돌', size: [4, 6, 5], x: 8, color: 0xa89878 }
        ].map(s => Object.assign(s, { vol: s.size[0] * s.size[1] * s.size[2], in: false, mesh: null, y: 0, target: 0 }));
        body.innerHTML = `
          <div class="info"><h4>수조 (안쪽) 가로 ${T.W} cm · 세로 ${T.D} cm · 높이 ${T.H} cm</h4>
            <p style="margin:0" class="muted">처음 물 높이는 ${T.water} cm야. 돌을 넣으면 돌의 부피만큼 물이 밀려 올라가.</p></div>
          <div class="stone-btns" id="t-stones">${STONES.map(s => `<button data-id="${s.id}" aria-pressed="false"><span>${s.name} <span class="muted" style="font-size:.85rem">${s.size.join('×')}</span></span><span class="tabnum">${s.vol} cm³ · 넣기</span></button>`).join('')}</div>
          <div class="info"><div class="gauge"><span>물 높이</span><b class="tabnum" id="t-level">${T.water}</b><span>cm</span></div>
            <p style="margin:.3rem 0 0" id="t-calc"></p></div>`;
        clearContent();
        const g = new THREE.Group(); content.add(g);
        const tankGeo = new THREE.BoxGeometry(T.W * k, T.H * k, T.D * k).translate(0, T.H * k / 2, 0);
        const glass = new THREE.Mesh(tankGeo, new THREE.MeshStandardMaterial({ color: 0xcfe8f0, transparent: true, opacity: 0.18, depthWrite: false, side: THREE.DoubleSide }));
        withEdges(glass); g.add(glass);
        const bottom = new THREE.Mesh(new THREE.BoxGeometry(T.W * k, 0.06, T.D * k), mat(0xb9a57e)); bottom.position.y = -0.03; g.add(bottom);
        const water = new THREE.Mesh(new THREE.BoxGeometry(T.W * k * 0.995, 1, T.D * k * 0.995), new THREE.MeshStandardMaterial({ color: 0x5fa0c8, transparent: true, opacity: 0.5, depthWrite: false, roughness: 0.2 }));
        water.renderOrder = 2; g.add(water);
        for (let y = 0; y <= T.H; y += 5) {
          const tick = new THREE.Mesh(new THREE.BoxGeometry(0.25, 0.02, 0.02), new THREE.MeshBasicMaterial({ color: 0x573719 }));
          tick.position.set(-T.W * k / 2 - 0.13, y * k, T.D * k / 2); g.add(tick);
          const l = label(`${y}`, { size: 0.2 }); l.position.set(-T.W * k / 2 - 0.42, y * k, T.D * k / 2); g.add(l);
        }
        const levelLab = label('', { size: 0.24 }); g.add(levelLab);
        let level = T.water, shown = T.water;
        STONES.forEach(s => {
          const [sx, sy, sz] = s.size;
          s.mesh = new THREE.Mesh(new THREE.BoxGeometry(sx * k, sy * k, sz * k), mat(s.color, { flatShading: true, roughness: 0.9 }));
          withEdges(s.mesh); s.y = T.H + 6; s.target = s.y; s.mesh.position.set(s.x * k, s.y * k, 0); s.mesh.visible = false; g.add(s.mesh);
        });
        function setLevelLabel(v) {
          water.scale.y = v * k; water.position.y = v * k / 2;
          if (levelLab.material.map) levelLab.material.map.dispose();
          const nl = label(`${fmt(v)} cm`, { color: '#2f6f8f', size: 0.24 });
          levelLab.material.map = nl.material.map; levelLab.scale.copy(nl.scale); nl.material.dispose();
          levelLab.position.set(T.W * k / 2 + 0.55, v * k, T.D * k / 2);
        }
        function recalc() {
          const vin = STONES.filter(s => s.in).reduce((a, s) => a + s.vol, 0);
          level = T.water + vin / BASE;
          $('t-calc').innerHTML = vin ? `늘어난 높이 = (넣은 돌의 부피) ÷ (수조의 밑넓이)<br>= ${vin} ÷ (${T.W} × ${T.D}) = ${vin} ÷ ${BASE} = <b style="font-weight:400;color:#2f6f8f">${fmt(vin / BASE)} cm</b>`
            : '돌을 골라서 수조에 넣어 봐!';
        }
        $('t-stones').addEventListener('click', e => {
          const b = e.target.closest('[data-id]'); if (!b) return;
          const s = STONES.find(x => x.id === b.dataset.id); s.in = !s.in;
          b.setAttribute('aria-pressed', String(s.in)); b.lastElementChild.textContent = `${s.vol} cm³ · ${s.in ? '빼기' : '넣기'}`;
          s.mesh.visible = true; s.target = s.in ? s.size[1] / 2 : T.H + 6; recalc();
        });
        setLevelLabel(level); recalc();
        tickFn = dt => {
          STONES.forEach(s => {
            if (Math.abs(s.y - s.target) < 0.01) { if (!s.in) s.mesh.visible = false; return; }
            s.y += Math.sign(s.target - s.y) * Math.min(Math.abs(s.target - s.y), dt * 30);
            s.mesh.position.y = s.y * k;
          });
          const settled = STONES.every(s => !s.in || Math.abs(s.y - s.target) < 0.5);
          const goal = settled ? level : T.water + STONES.filter(s => s.in && s.y - s.size[1] / 2 < shown).reduce((a, s) => a + s.vol, 0) / BASE;
          if (Math.abs(goal - shown) > 0.001) { shown += (goal - shown) * Math.min(1, dt * 5); if (Math.abs(goal - shown) < 0.005) shown = goal; setLevelLabel(shown); $('t-level').textContent = fmt(shown); }
        };
        setBadge('수조 실험 · 돌을 넣고 빼 봐');
        frame(boxOf(glass).expandByScalar(0.4), new THREE.Vector3(0.35, 0.55, 1.4));
      }

          <div class="conv"><div class="group-label">단위 바꾸기 마법</div>
            <div class="flex gap-2"><label for="c-num" class="sr-only">값</label><input id="c-num" type="number" inputmode="decimal" value="2" step="any">

            <div class="conv-out" id="c-out"></div></div>`;
        const F = { m3: 1e6, cm3: 1, L: 1000, mL: 1 }, NAME = { m3: 'm³', cm3: 'cm³', L: 'L', mL: 'mL' };
        const nice = v => v >= 1e-6 ? Number(v.toPrecision(10)).toLocaleString('ko-KR', { maximumFractionDigits: 8 }) : v.toExponential(3);
        function conv() {
          const v = parseFloat($('c-num').value), from = $('c-unit').value;
          if (!isFinite(v)) { $('c-out').innerHTML = '<div>숫자를 적어 줘.</div>'; return; }
          const cm3 = v * F[from];
          $('c-out').innerHTML = Object.keys(F).filter(u => u !== from).map(u => `<div><span>${NAME[u]}</span><span class="tabnum">${nice(cm3 / F[u])} ${NAME[u]}</span></div>`).join('');
        }
        $('c-num').addEventListener('input', conv); $('c-unit').addEventListener('change', conv); conv();
        clearContent();
        const s = 3, g = new THREE.Group(); content.add(g);
        const cube = new THREE.Mesh(new THREE.BoxGeometry(s, s, s).translate(0, s / 2, 0), new THREE.MeshStandardMaterial({ color: 0xcfe3de, transparent: true, opacity: 0.35, depthWrite: false }));
        withEdges(cube); g.add(cube);
        const pts = [], n = 10, st = s / n, h = s / 2;
        for (let i = 1; i < n; i++) {

          pts.push(c, 0, h, c, s, h, -h, c + h, h, h, c + h, h); // 앞면
          pts.push(h, 0, c, h, s, c, h, c + h, -h, h, c + h, h); // 오른쪽면
          pts.push(c, s, -h, c, s, h, -h, s, c, h, s, c); // 윗면
        }
        const grid = new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(pts, 3)), lineMat({ opacity: 0.25 }));
        g.add(grid);
        const one = new THREE.Mesh(new THREE.BoxGeometry(st, st, st), mat(COL.hi)); one.position.set(h - st / 2, st / 2, h - st / 2); withEdges(one); g.add(one);
        const l1 = label('1 m = 100 cm', { size: 0.28 }); l1.position.set(0, -0.3, h + 0.2); g.add(l1);
        const l2 = label('10 cm 정육면체 = 1 L', { color: '#c2553f', size: 0.26 }); l2.position.set(h + 0.9, st + 0.3, h); g.add(l2);
        setBadge('1 m³ 정육면체 안을 들여다봐');
        frame(boxOf(g), new THREE.Vector3(1, 0.9, 1.3));
      }

        { type: 'short', q: '밑변 6 cm인 정사각형을 밑면으로 하고, 옆면 삼각형의 높이가 5 cm인 정사각뿔의 겉넓이는?', unit: 'cm²', answers: ['96'], hint: '밑넓이 6×6 + 옆면 삼각형 4개 (½ × 6 × 5) × 4', explain: '36 + 60 = 96 (cm²)' }
      ],
      volume: [
        { type: 'short', q: '4단원 실험실의 L자형 입체(전체 가로 8, 높이 6, 깊이 4, 아래층 두께 2, 위층 가로 3 cm)의 부피는?', unit: 'cm³', answers: ['112'], hint: '두 덩어리로 나누거나, 큰 상자 8×4×6에서 빈 곳을 빼 봐.', explain: '64 + 48 = 112 (cm³)' },
        { type: 'short', q: '바깥 반지름 4 cm, 구멍 반지름 2 cm, 높이 6 cm인 구멍 뚫린 원기둥의 부피는?', unit: 'cm³', answers: ['72π'], hint: 'π × (R² − r²) × h = π × (16 − 4) × 6', explain: '72π (cm³)' },
        { type: 'short', q: '밑면이 가로 24 cm, 세로 10 cm인 수조에 부피 480 cm³인 돌을 완전히 잠기게 넣었어. 물의 높이는 몇 cm 올라갈까?', unit: 'cm', answers: ['2'], hint: '늘어난 높이 = (돌의 부피) ÷ (수조의 밑넓이)', explain: '480 ÷ 240 = 2 (cm)' },
        { type: 'short', q: '2 m³는 몇 cm³일까?', unit: 'cm³', answers: ['2000000'], hint: '1 m³ = 100 × 100 × 100 cm³', explain: '2 × 1,000,000 = 2,000,000 (cm³)' },
        { type: 'short', q: '3,500,000 cm³는 몇 m³일까?', unit: 'm³', answers: ['3.5'], hint: '1,000,000 cm³ = 1 m³ 이니까 1,000,000으로 나눠.', explain: '3,500,000 ÷ 1,000,000 = 3.5 (m³)' },
        { type: 'short', q: '밑면의 반지름 3 cm, 높이 4 cm인 원뿔의 부피는?', unit: 'cm³', answers: ['12π'], hint: '원뿔의 부피 = ⅓ × (밑넓이) × (높이)', explain: '⅓ × 9π × 4 = 12π (cm³)' }
      ]
    };
    const UNIT_TITLES = { observe: '1단원 문제 · 입체도형 관찰', net: '2단원 문제 · 전개도', area: '3단원 문제 · 겉넓이', volume: '4단원 문제 · 부피' };

    /* =========================================================
       화면 전환
       ========================================================= */
    const UNITS = { observe: unitObserve, net: unitNet, area: unitArea, volume: unitVolume };
    function go(unit, push = true) {
      const isHome = unit === 'home' || !UNITS[unit];
      $('home').hidden = !isHome; $('unit').hidden = isHome; $('unit-tabs').hidden = isHome;
      document.querySelectorAll('#unit-tabs [data-unit]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.unit === unit)));
      if (push) history.pushState(null, '', isHome ? location.pathname : '#' + unit);
      tickFn = null; setBadge(''); clearContent();
      if (isHome) { setAutoRotate(false); return; }
      resize();
      UNITS[unit]($('panel'));
      Forest.mountQuiz($('quiz'), { key: 'solid-' + unit, title: UNIT_TITLES[unit], questions: QUIZZES[unit].map(q => Object.assign({ keys: ['π', '.'] }, q)) });
      window.scrollTo({ top: 0 });
    }
    document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
    document.querySelectorAll('#unit-tabs [data-unit]').forEach(b => b.addEventListener('click', () => go(b.dataset.unit)));
    window.addEventListener('popstate', () => go(location.hash.slice(1) || 'home', false));
    document.fonts.load('46px Jua').finally(() => go(location.hash.slice(1) || 'home', false));
  </script>
