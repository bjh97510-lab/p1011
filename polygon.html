  <meta property="og:type" content="website">
  <meta property="og:site_name" content="숲속 마법학교">

  <meta property="og:description" content="대각선은 몇 개? 내각의 합은? 꼭짓점 수를 바꾸며 다각형의 규칙을 찾아 봐!">

    .lab { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); padding: 18px 18px 18px 24px; }
    @media (max-width: 820px) { .lab { grid-template-columns: minmax(0, 1fr); } }
    .lab-svg { width: 100%; max-width: 380px; aspect-ratio: 1; margin: 0 auto; display: block; }
    .s-base { stroke: var(--line); stroke-width: 2; fill: none; }
    .s-hl { stroke: #e0a33a; stroke-width: 4; fill: none; stroke-linecap: round; }
    .f-hl { fill: rgba(232, 182, 74, .38); stroke: #e0a33a; stroke-width: 2; }
    .f-dot { fill: var(--ink); }
    .t-lab { fill: var(--ink); font: 13px var(--font-story); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="signboard" style="margin-bottom:18px">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <a class="back" href="index.html#plane">← 평면도형 갈림길로</a>
          <h1>숲속 마법학교 · 다각형</h1>
        </div>
        <div class="pouch" id="pouch" aria-label="보상 주머니"></div>
      </div>
      <nav class="tabbar" role="tablist">
        <button class="tab" role="tab" id="t-library" aria-controls="tab-library" aria-selected="true">다각형 도서관</button>
        <button class="tab" role="tab" id="t-quiz" aria-controls="tab-quiz" aria-selected="false">챌린지 숲</button>
      </nav>
    </header>

    <section id="tab-library" role="tabpanel" aria-labelledby="t-library" class="grid gap-5">
      <div>
        <h2 class="section-title">다각형 도서관 · 꼭 알아야 할 말 7가지</h2>
        <p class="lead">그림에서 노랗게 빛나는 부분이 그 용어가 가리키는 곳이야.</p>
      </div>
      <div class="term-grid" id="term-grid"></div>

      <div class="tome">
        <div class="lab">
          <div class="grid gap-3" style="min-width:0">
            <div>
              <h2 class="section-title" style="font-size:1.35rem">다각형 실험실</h2>
              <p class="lead" style="font-size:.95rem">꼭짓점 수를 바꾸고, 보고 싶은 것을 골라 봐. "모양 흔들기"를 누르면 찌그러진 다각형에서도 규칙이 그대로인지 확인할 수 있어.</p>
            </div>
            <svg id="lab-svg" class="lab-svg" viewBox="0 0 360 360" role="img" aria-label="꼭짓점 수에 따라 바뀌는 다각형 그림"></svg>
            <div class="slider-row">
              <label for="n-range"><span>꼭짓점(변)의 수 n</span><output id="n-out" class="tabnum">6 (육각형)</output></label>
              <input id="n-range" class="leaf" type="range" min="3" max="12" step="1" value="6">
            </div>
            <div class="chip-row" id="mode-chips" aria-label="보기 방식">
              <button class="chip" data-mode="fan" aria-pressed="true">삼각형으로 나누기</button>
              <button class="chip" data-mode="all" aria-pressed="false">대각선 모두</button>
              <button class="chip" data-mode="ext" aria-pressed="false">외각 보기</button>
            </div>
            <div class="chip-row">
              <button class="chip" id="wobble" aria-pressed="false">모양 흔들기</button>
            </div>
          </div>
          <div class="grid gap-2 content-start" id="formulas" aria-live="polite" style="min-width:0"></div>
        </div>
      </div>
    </section>

    <section id="tab-quiz" role="tabpanel" aria-labelledby="t-quiz" hidden>
      <div id="quiz"></div>
    </section>
  </div>

  <script src="assets/forest.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    Forest.mountPouch($('pouch'));
    const NAMES = ['', '', '', '삼각형', '사각형', '오각형', '육각형', '칠각형', '팔각형', '구각형', '십각형', '십일각형', '십이각형'];
    const f1 = n => Math.round(n * 100) / 100;
    const txt = (x, y, s, cls = 't-lab') => `<text x="${f1(x)}" y="${f1(y)}" class="${cls}" text-anchor="middle" dominant-baseline="middle">${s}</text>`;

    /* ---------- 용어 카드 ---------- */
    function regular(n, cx, cy, R, rot = -90) {
      return Array.from({ length: n }, (_, i) => { const a = (rot + i * 360 / n) * Math.PI / 180; return [cx + R * Math.cos(a), cy + R * Math.sin(a)]; });
    }
    const pts = p => p.map(q => q.map(f1).join(',')).join(' ');
    function termFig(k) {
      const P = [[22, 70], [40, 20], [86, 14], [102, 52], [70, 76]];
      const base = `<polygon points="${pts(P)}" class="s-base"/>`;
      let s = '';
      switch (k) {
        case 'polygon': s = `<polygon points="${pts(P)}" class="f-hl"/>`; break;
        case 'side': s = base + `<line x1="40" y1="20" x2="86" y2="14" class="s-hl"/>` + P.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" class="f-dot"/>`).join(''); break;
        case 'interior': s = base + `<path d="M86 14 L74.1 15.6 A12 12 0 0 0 91 25 Z" class="f-hl"/>`; break;
        case 'exterior': s = base + `<line x1="86" y1="14" x2="112" y2="10.6" class="s-base" stroke-dasharray="3 3"/><path d="M86 14 L100 12.2 A14 14 0 0 1 91.8 26.7 Z" class="f-hl"/>`; break;
        case 'diagonal': s = base + `<line x1="40" y1="20" x2="102" y2="52" class="s-hl"/><line x1="40" y1="20" x2="70" y2="76" class="s-hl" style="opacity:.5"/>`; break;
        case 'regular': { const R = regular(6, 60, 44, 34); s = `<polygon points="${pts(R)}" class="f-hl"/>`; break; }
        case 'triangle': s = `<polygon points="14,72 50,14 104,72" class="s-base"/><line x1="104" y1="72" x2="118" y2="72" class="s-base" stroke-dasharray="3 3"/><path d="M104 72 L118 72 A14 14 0 0 0 96.6 60.1 Z" class="f-hl"/><path d="M14 72 L26 72 A12 12 0 0 0 20.4 61.8 Z" fill="rgba(127,176,105,.5)"/><path d="M50 14 L43.7 24.2 A12 12 0 0 0 57.3 23.6 Z" fill="rgba(127,176,105,.5)"/>`; break;
      }
      return `<svg viewBox="0 0 120 86" aria-hidden="true">${s}</svg>`;
    }
    const TERMS = [
      { k: 'polygon', name: '다각형', d: '세 개 이상의 선분으로 둘러싸인 평면도형이야. 선분이 n개면 n각형이라고 불러.' },
      { k: 'side', name: '변과 꼭짓점', d: '다각형을 이루는 선분이 변, 변과 변이 만나는 점이 꼭짓점이야. n각형은 변도 꼭짓점도 n개!' },
      { k: 'interior', name: '내각', d: '다각형의 안쪽에서 이웃한 두 변이 만드는 각이야.' },
      { k: 'exterior', name: '외각', d: '한 변을 연장한 선과 이웃한 변이 만드는 각. 한 꼭짓점에서 내각 + 외각 = 180°야.' },
      { k: 'diagonal', name: '대각선', d: '서로 이웃하지 않는 두 꼭짓점을 이은 선분이야. 한 꼭짓점에서 n − 3개를 그을 수 있어.' },
      { k: 'regular', name: '정다각형', d: '모든 변의 길이가 같고, 모든 내각의 크기도 같은 다각형이야. 둘 중 하나만 같으면 정다각형이 아니야!' },
      { k: 'triangle', name: '삼각형의 내각과 외각', d: '세 내각의 합은 180°. 한 외각의 크기는 이웃하지 않는 두 내각의 합과 같아.' }
    ];
    $('term-grid').innerHTML = TERMS.map(t => `<div class="parchment term">${termFig(t.k)}<div style="min-width:0"><h3>${t.name}</h3><p>${t.d}</p></div></div>`).join('');

    /* ---------- 실험실 ---------- */
    let mode = 'fan', wobble = false, jitter = [];
    function makeJitter() { jitter = Array.from({ length: 12 }, () => ({ r: .78 + Math.random() * .22, a: (Math.random() - .5) * .5 })); }
    makeJitter();
    function verts(n) {
      return Array.from({ length: n }, (_, i) => {
        const j = wobble ? jitter[i] : { r: 1, a: 0 };
        const a = (-90 + (i + j.a) * 360 / n) * Math.PI / 180, R = 140 * j.r;
        return [180 + R * Math.cos(a), 185 + R * Math.sin(a)];
      });
    }
    const TRI_COLORS = ['rgba(232,182,74,.45)', 'rgba(127,176,105,.45)', 'rgba(95,145,175,.4)', 'rgba(224,122,95,.4)'];
    function frac(n, d) {
      const g = (a, b) => b ? g(b, a % b) : a; const k = g(n, d); n /= k; d /= k;
      return d === 1 ? `${n}` : `<span class="frac"><span>${n}</span><span>${d}</span></span> (≈ ${f1(n / d)})`;
    }

    function drawLab() {
      const n = +$('n-range').value, V = verts(n);
      $('n-out').textContent = `${n} (${NAMES[n]})`;
      let s = '';
      if (mode === 'fan') {
        for (let k = 1; k < n - 1; k++) s += `<polygon points="${pts([V[0], V[k], V[k + 1]])}" fill="${TRI_COLORS[(k - 1) % 4]}"/>`;
        for (let k = 2; k < n - 1; k++) s += `<line x1="${f1(V[0][0])}" y1="${f1(V[0][1])}" x2="${f1(V[k][0])}" y2="${f1(V[k][1])}" stroke="#c2553f" stroke-width="2.5" stroke-dasharray="7 5"/>`;
        for (let k = 1; k < n - 1; k++) { const cx = (V[0][0] + V[k][0] + V[k + 1][0]) / 3, cy = (V[0][1] + V[k][1] + V[k + 1][1]) / 3; s += txt(cx, cy, k); }
      }
      if (mode === 'all') {
        for (let i = 0; i < n; i++) for (let j = i + 2; j < n; j++) if (!(i === 0 && j === n - 1))
          s += `<line x1="${f1(V[i][0])}" y1="${f1(V[i][1])}" x2="${f1(V[j][0])}" y2="${f1(V[j][1])}" stroke="#c2553f" stroke-width="1.6" opacity=".7"/>`;
      }
      s += `<polygon points="${pts(V)}" fill="${mode === 'ext' ? 'rgba(255,250,235,.7)' : 'none'}" stroke="#573719" stroke-width="3" stroke-linejoin="round"/>`;
      if (mode === 'ext') {
        for (let i = 0; i < n; i++) {
          const p0 = V[(i - 1 + n) % n], p = V[i], p1 = V[(i + 1) % n];
          let d1 = [p[0] - p0[0], p[1] - p0[1]], d2 = [p1[0] - p[0], p1[1] - p[1]];
          const L1 = Math.hypot(...d1), L2 = Math.hypot(...d2); d1 = d1.map(v => v / L1); d2 = d2.map(v => v / L2);
          const r = 22, sweep = d1[0] * d2[1] - d1[1] * d2[0] > 0 ? 1 : 0;
          s += `<line x1="${f1(p[0])}" y1="${f1(p[1])}" x2="${f1(p[0] + d1[0] * 40)}" y2="${f1(p[1] + d1[1] * 40)}" stroke="#9c8a6c" stroke-width="1.8" stroke-dasharray="4 4"/>`;
          s += `<path d="M${f1(p[0])} ${f1(p[1])} L${f1(p[0] + d1[0] * r)} ${f1(p[1] + d1[1] * r)} A${r} ${r} 0 0 ${sweep} ${f1(p[0] + d2[0] * r)} ${f1(p[1] + d2[1] * r)} Z" fill="${TRI_COLORS[i % 4].replace('.45', '.75').replace('.4)', '.7)')}" stroke="#573719" stroke-width="1"/>`;
        }
      }
      s += V.map((p, i) => `<circle cx="${f1(p[0])}" cy="${f1(p[1])}" r="${i === 0 && mode === 'fan' ? 6 : 4}" fill="${i === 0 && mode === 'fan' ? '#c2553f' : '#2f251a'}"/>`).join('');
      $('lab-svg').innerHTML = s;

      const rows = [
        { c: '#c2553f', name: '한 꼭짓점에서 그은 대각선', eq: 'n − 3', sub: `${n} − 3`, res: `${n - 3}개` },
        { c: '#e8b64a', name: '나누어지는 삼각형', eq: 'n − 2', sub: `${n} − 2`, res: `${n - 2}개` },
        { c: '#c2553f', name: '대각선의 총 개수', eq: `<span class="frac"><span>n(n − 3)</span><span>2</span></span>`, sub: `${n} × ${n - 3} ÷ 2`, res: `${n * (n - 3) / 2}개` },
        { c: '#7fb069', name: '내각의 크기의 합', eq: '180° × (n − 2)', sub: `180° × ${n - 2}`, res: `${180 * (n - 2)}°` },
        { c: '#5f91af', name: '외각의 크기의 합', eq: '항상 360°', sub: 'n과 상관없이 똑같아!', res: '360°' },
        { c: '#8a5a32', name: `정${NAMES[n]}의 한 내각`, eq: `<span class="frac"><span>180° × (n − 2)</span><span>n</span></span>`, sub: `${180 * (n - 2)}° ÷ ${n}`, res: frac(180 * (n - 2), n) + '°' },
        { c: '#e07a5f', name: `정${NAMES[n]}의 한 외각`, eq: `<span class="frac"><span>360°</span><span>n</span></span>`, sub: `360° ÷ ${n}`, res: frac(360, n) + '°' }
      ];
      $('formulas').innerHTML = rows.map(o => `
        <div class="formula"><span class="sw" style="background:${o.c}"></span>
          <div style="min-width:0">
            <div class="flex flex-wrap justify-between gap-x-3"><span class="name">${o.name}</span><span>${o.eq}</span></div>
            <div class="sub">${o.sub} = <span class="res">${o.res}</span></div>
          </div></div>`).join('') +
        (wobble ? `<p class="muted" style="margin:.2rem 0 0;font-size:.88rem">찌그러진 모양이어도 대각선 수와 내각·외각의 합은 그대로야. 한 내각·한 외각 공식은 정다각형일 때만 쓸 수 있어.</p>` : '');
    }
    $('n-range').addEventListener('input', drawLab);
    $('mode-chips').addEventListener('click', e => {
      const b = e.target.closest('[data-mode]'); if (!b) return;
      mode = b.dataset.mode;
      $('mode-chips').querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      drawLab();
    });
    $('wobble').addEventListener('click', e => {
      wobble = !wobble; if (wobble) makeJitter();
      e.currentTarget.setAttribute('aria-pressed', String(wobble));
      e.currentTarget.textContent = wobble ? '정다각형으로 되돌리기' : '모양 흔들기';
      drawLab();
    });
    drawLab();

    /* ---------- 문제 ---------- */
    const hexFig = `<svg viewBox="0 0 200 120"><polygon points="${pts(regular(6, 100, 60, 50))}" fill="rgba(232,182,74,.35)" stroke="#573719" stroke-width="3"/></svg>`;
    const triFig = `<svg viewBox="0 0 220 120"><polygon points="20,100 80,18 170,100" fill="rgba(255,250,235,.8)" stroke="#573719" stroke-width="3" stroke-linejoin="round"/>
      <line x1="170" y1="100" x2="212" y2="100" stroke="#9c8a6c" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="40" y="92" font-family="Jua" font-size="15" fill="#2f251a">45°</text><text x="72" y="44" font-family="Jua" font-size="15" fill="#2f251a">70°</text>
      <text x="186" y="88" font-family="Jua" font-size="17" fill="#c2553f">x</text></svg>`;
    const QUESTIONS = [
      { tag: '다각형의 뜻', type: 'mc', q: '다음 중 <b>다각형이 아닌 것</b>은 무엇일까?', options: ['삼각형', '오각형', '원', '정육각형'], answer: 2,
        hint: '다각형은 "선분"으로만 둘러싸인 도형이야. 곡선이 있으면 안 돼!', explain: '원은 곡선으로 둘러싸여 있어서 다각형이 아니야.' },
      { tag: '정다각형', type: 'mc', q: '정다각형이 되려면 어떤 조건이 필요할까?', options: ['변의 길이만 모두 같으면 돼', '내각의 크기만 모두 같으면 돼', '변의 길이와 내각의 크기가 모두 같아야 해', '대각선의 길이가 모두 같아야 해'], answer: 2,
        hint: '마름모는 변의 길이가 모두 같지만 정사각형이 아니고, 직사각형은 내각이 모두 같지만 정사각형이 아니야.', explain: '변의 길이와 내각의 크기가 모두 같아야 정다각형이야.' },
      { tag: '내각과 외각', type: 'short', q: '어떤 다각형의 한 내각의 크기가 110°야. 이 꼭짓점에서 외각의 크기는 몇 도일까?', unit: '°', answers: ['70'],
        hint: '한 꼭짓점에서 (내각) + (외각) = 180°', explain: '180° − 110° = 70°' },
      { tag: '대각선', type: 'short', q: '칠각형의 한 꼭짓점에서 그을 수 있는 대각선은 몇 개일까?', unit: '개', answers: ['4'],
        hint: '자기 자신과 이웃한 두 꼭짓점에는 대각선을 그을 수 없어. n − 3', explain: '7 − 3 = 4 (개)' },
      { tag: '대각선', type: 'short', q: '팔각형의 대각선은 모두 몇 개일까?', unit: '개', answers: ['20'],
        hint: '대각선의 총 개수 = n(n − 3) ÷ 2. 2로 나누는 건 같은 대각선을 두 번 세기 때문이야.', explain: '8 × 5 ÷ 2 = 20 (개)' },
      { tag: '대각선', type: 'short', q: '대각선이 모두 35개인 다각형은 몇 각형일까? (숫자로 답해도 돼)', unit: '각형', answers: ['10', '10각형', '십각형'],
        hint: 'n(n − 3) ÷ 2 = 35 → n(n − 3) = 70. 차이가 3인 두 수의 곱이 70인 걸 찾아 봐.', explain: 'n(n − 3) = 70 → 10 × 7 = 70 이므로 십각형' },
      { tag: '내각의 합', type: 'short', q: '육각형의 내각의 크기의 합은 몇 도일까?', unit: '°', answers: ['720'], fig: hexFig,
        hint: '한 꼭짓점에서 대각선을 그으면 삼각형 (6 − 2)개로 나뉘어. 180° × (n − 2)', explain: '180° × 4 = 720°' },
      { tag: '내각의 합', type: 'short', q: '내각의 크기의 합이 1260°인 다각형은 몇 각형일까?', unit: '각형', answers: ['9', '9각형', '구각형'],
        hint: '180° × (n − 2) = 1260° 이니까 n − 2 = ?', explain: '1260 ÷ 180 = 7 = n − 2 → n = 9, 구각형' },
      { tag: '정다각형', type: 'short', q: '정팔각형의 한 내각의 크기는 몇 도일까?', unit: '°', answers: ['135'],
        hint: '내각의 합 180° × 6 = 1080°를 8개의 똑같은 각으로 나눠 봐.', explain: '1080° ÷ 8 = 135°' },
      { tag: '외각', type: 'short', q: '정오각형의 한 외각의 크기는 몇 도일까?', unit: '°', answers: ['72'],
        hint: '외각의 합은 언제나 360°! 정다각형은 외각이 모두 같아.', explain: '360° ÷ 5 = 72°' },
      { tag: '외각', type: 'short', q: '십이각형의 외각의 크기의 합은 몇 도일까?', unit: '°', answers: ['360'],
        hint: '외각의 합은 변의 개수와 상관이 없어.', explain: '어떤 다각형이든 외각의 합은 360°' },
      { tag: '외각', type: 'short', q: '한 외각의 크기가 40°인 정다각형은 정몇각형일까?', unit: '각형', answers: ['9', '9각형', '정9각형', '정구각형', '구각형'],
        hint: '360° ÷ (한 외각) = 꼭짓점의 수', explain: '360 ÷ 40 = 9 → 정구각형' },
      { tag: '삼각형', type: 'short', q: '삼각형의 두 내각이 50°, 60°야. 나머지 한 내각은 몇 도일까?', unit: '°', answers: ['70'],
        hint: '삼각형의 세 내각의 합은 180°', explain: '180° − 50° − 60° = 70°' },
      { tag: '삼각형', type: 'short', q: '그림에서 x의 크기는 몇 도일까?', unit: '°', answers: ['115'], fig: triFig,
        hint: '삼각형의 한 외각은 이웃하지 않는 두 내각의 합과 같아.', explain: 'x = 45° + 70° = 115°' },
      { tag: '실생활', type: 'short', q: '벌집은 정육각형 방이 빈틈없이 붙어 있어. 한 꼭짓점에 정육각형이 몇 개 모여 있을까?', unit: '개', answers: ['3'], fig: hexFig,
        hint: '정육각형의 한 내각은 120°. 한 점을 빙 둘러싼 각은 360°야.', explain: '360° ÷ 120° = 3 (개)' }
    ].map(q => Object.assign({ keys: ['.'] }, q));
